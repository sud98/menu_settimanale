<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menù di Casa</title>
  <meta name="description" content="Il menu settimanale che impara i gusti della famiglia">
  <meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1715" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Menù">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view" class="view"><p class="loading">Caricamento…</p></main>

  <nav class="tabbar" aria-label="Sezioni">
    <a href="#/menu" data-tab="menu"><span aria-hidden="true">🍽️</span>Menu</a>
    <a href="#/spesa" data-tab="spesa"><span aria-hidden="true">🛒</span>Spesa</a>
    <a href="#/piatti" data-tab="piatti"><span aria-hidden="true">📖</span>Piatti</a>
    <a href="#/gusti" data-tab="gusti"><span aria-hidden="true">❤️</span>Gusti</a>
    <a href="#/profilo" data-tab="profilo"><span aria-hidden="true">⚙️</span>Profilo</a>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // Se manca un file del sito (es. non caricato su GitHub) lo dico invece di lasciare la pagina vuota.
    function appNonCaricata() {
      var files = ['app.js', 'engine.js', 'store.js', 'seed.js', 'config.js', 'ai.js', 'style.css'];
      var view = document.getElementById('view');
      view.innerHTML = '<p style="padding:16px">Non riesco a caricare l’app: controllo i file…</p>';
      Promise.all(files.map(function (f) {
        return fetch(f, { cache: 'no-store' }).then(function (r) { return r.ok ? null : f; }, function () { return f; });
      })).then(function (mancanti) {
        mancanti = mancanti.filter(Boolean);
        view.innerHTML = '<div style="padding:16px;font-family:system-ui">' +
          '<h2>L’app non si è caricata</h2>' +
          (mancanti.length
            ? '<p>Sul sito mancano questi file: <b>' + mancanti.join(', ') + '</b>.<br>Caricali nel repository GitHub e ricarica la pagina.</p>'
            : '<p>Sembra un problema di connessione: ricarica la pagina.</p>') +
          '</div>';
      });
    }
  </script>
  <script type="module" src="app.js" onerror="appNonCaricata()"></script>
</body>
</html>
